    <div class="section-title">📝 리뷰 불만 분석</div>
    <div class="section-sub">별점 1~3점 집중 분석 · 카테고리 클릭 시 실제 리뷰 확인 · 시장 공백 연결</div>
    <div id="review-panel-product">${buildProductReviewAnalysis()}</div>
    <div id="review-panel-market" style="display:none">${buildMarketAnalysis()}</div>
  `;
}

function showReviewTab(tab, btn) {
  ['product','market'].forEach(t => {
    const el = document.getElementById(`review-panel-${t}`);
    if(el) el.style.display = t===tab?'':'none';
    const tb = document.getElementById(`rtab-${t}`);
    if(tb){tb.style.color=''; tb.style.borderColor=''; tb.style.fontWeight='';}
  });
  if(btn){btn.style.color='var(--gold-dk)'; btn.style.borderColor='var(--gold)'; btn.style.fontWeight='600';}
}

// 카테고리 토글 — 각 카드 독립적으로 열고 닫기 (아코디언 없음)
function toggleReviewCat(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const isOpen = el.style.display !== 'none';
  el.style.display = isOpen ? 'none' : '';
  const btn = document.getElementById('toggle-btn-' + elId);
  if (btn) btn.textContent = isOpen ? '▼ 리뷰 보기' : '▲ 접기';
}

function buildProductReviewAnalysis() {
  const allRevs = APP.reviews;
  const lowRevs = allRevs.filter(r=>num(r.rating)<=3);
  const products = [...new Set(lowRevs.map(r=>r.productName))];

  const hint = `
    <div style="font-size:.74rem;color:var(--text-md);background:rgba(99,102,241,.06);border-left:3px solid #6366F1;padding:8px 12px;border-radius:4px;margin-bottom:14px;line-height:1.7">
      💡 <b>활용법:</b> 카테고리 카드를 클릭하면 대표 리뷰를 바로 확인할 수 있습니다.
      건수는 <b>크롤링 전체 데이터 기준</b>이며, 리뷰는 대표 20건을 표시합니다.
      현재 <b>${allRevs.length}개 리뷰 입력 · ${products.length}개 제품</b> 분석 중.
    </div>`;

  const cards = products.map(name => {
    const crawlData = (typeof REVIEW_CRAWL_DATA !== 'undefined') && REVIEW_CRAWL_DATA && REVIEW_CRAWL_DATA[name];
    const pRevs = lowRevs.filter(r=>r.productName===name);
    const totalForProd = crawlData ? crawlData.total : allRevs.filter(r=>r.productName===name).length;
    const starDistData = crawlData ? crawlData.starDist : null;
    const starDist = [5,4,3,2,1].map(s=>({
      s, n: starDistData ? (starDistData[String(s)]||0) : allRevs.filter(r=>r.productName===name&&num(r.rating)===s).length
    }));

    const catData = COMPLAINT_CATEGORIES.map(cat => {
      if (crawlData && crawlData.cats && crawlData.cats[cat.key]) {
        const cd = crawlData.cats[cat.key];
        return { ...cat, count:cd.count, pct:cd.pct, lowCount:cd.lowCount, repReviews:cd.reps||[] };
      }
      const matched = pRevs.filter(r=>(r.tags||[]).some(t=>cat.tags.includes(t)));
      return { ...cat, count:matched.length, pct:totalForProd>0?Math.round(matched.length/totalForProd*100*10)/10:0, lowCount:matched.length,
        repReviews:matched.slice(0,20).map(r=>({star:num(r.rating),date:r.date,content:r.content,option:''})) };
    }).filter(c=>c.count>0).sort((a,b)=>b.count-a.count).slice(0,6); // 상위 6개만

    const prodId = 'prod-' + name.replace(/\s/g,'').replace(/[^\w가-힣]/g,'').slice(0,20);

    const catCards = catData.map((cat, ci) => {
      const col = cat.color || '#6366F1';  // 카테고리 고정 색상
      const listId = prodId + '-cat-' + ci;
      const barPct = Math.min(cat.pct, 100);
      const repCount = (cat.repReviews||[]).length;

      const reviewItems = (cat.repReviews||[]).map(rv => {
        const star = typeof rv.star==='number'?rv.star:num(rv.star||rv.rating||1);
        const stars = '★'.repeat(star)+'☆'.repeat(5-star);
        const scent = rv.option&&rv.option.includes('향')?rv.option.split('향 선택:').pop().trim().slice(0,25):'';
        return `
          <div style="background:var(--ivory);border:1px solid var(--border-lt);border-radius:8px;padding:10px 14px;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="color:#EF4444;font-size:.82rem">${stars}</span>
              <span style="font-size:.67rem;color:var(--text-lt)">${rv.date||''}</span>
              ${scent?`<span style="font-size:.62rem;background:rgba(99,102,241,.1);color:#4338CA;border-radius:8px;padding:1px 6px">${scent}</span>`:''}
            </div>
            <div style="font-size:.78rem;color:var(--text);line-height:1.7">"${rv.content}"</div>
          </div>`;
      }).join('');

      return `
        <div style="border:1.5px solid ${col}44;border-radius:10px;overflow:hidden;flex:1;min-width:160px">
          <div onclick="toggleReviewCat('${listId}')"
               style="background:${col}10;padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.15s"
               onmouseover="this.style.background='${col}20'" onmouseout="this.style.background='${col}10'">
            <span style="font-size:1.1rem;flex-shrink:0">${cat.icon}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:.78rem;font-weight:700;color:var(--text)">${cat.key}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:4px">
                <span style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:${col};line-height:1">${cat.count.toLocaleString()}건</span>
                <div style="flex:1;height:4px;background:${col}22;border-radius:2px">
                  <div style="height:100%;width:${barPct}%;background:${col};border-radius:2px"></div>
                </div>
                <span style="font-size:.65rem;color:${col};font-weight:700">${cat.pct}%</span>
              </div>
            </div>
            <span id="toggle-btn-${listId}" style="font-size:.75rem;color:${col};flex-shrink:0">▼</span>
          </div>
          <div id="${listId}" class="review-cat-list"
               style="display:none;border-top:1.5px solid ${col}33;padding:12px 14px;background:white;max-height:460px;overflow-y:auto">
            <div style="font-size:.7rem;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-lt);display:flex;align-items:center;gap:6px">
              <span style="color:var(--text-md)">전체 ${totalForProd.toLocaleString()}건 중 <b style="color:${col}">${cat.count.toLocaleString()}건(${cat.pct}%)</b>가 이 불만</span>
              <span style="margin-left:auto;background:${col}12;color:${col};border-radius:8px;padding:2px 8px;font-size:.65rem">대표 리뷰 ${repCount}건</span>
            </div>
            ${reviewItems||'<div style="color:var(--text-lt);font-size:.75rem">대표 리뷰 없음</div>'}
          </div>
        </div>`;
    }).join('<div style="width:5px;flex-shrink:0"></div>');

    const starDistHtml = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${starDist.map(({s,n})=>{
          const sp = totalForProd>0?Math.round(n/totalForProd*100):0;
          const sc = s>=4?'#22C55E':s===3?'#F59E0B':'#EF4444';
          return n>0?`<div style="display:flex;align-items:center;gap:4px;font-size:.7rem">
              <span style="color:${sc}">${'★'.repeat(s)}</span>
              <span style="color:var(--text-lt);font-weight:600">${n.toLocaleString()}건</span>
              <div style="width:36px;height:4px;background:var(--border-lt);border-radius:2px">
                <div style="height:100%;width:${sp}%;background:${sc};border-radius:2px"></div>
              </div>
              <span style="color:var(--text-lt);font-size:.62rem">${sp}%</span>
            </div>`:'';
        }).join('')}
        <span style="font-size:.68rem;color:var(--text-lt);margin-left:4px">총 ${totalForProd.toLocaleString()}개 리뷰 기준</span>
        ${crawlData?'<span style="font-size:.62rem;background:rgba(34,197,94,.1);color:#166534;border-radius:6px;padding:1px 6px">크롤링 데이터</span>':''}
      </div>`;

    const lowCount = crawlData?(crawlData.starDist['1']||0)+(crawlData.starDist['2']||0):pRevs.length;
    return `
      <div class="card" style="margin-bottom:12px">
        <div class="card-header" style="background:var(--ivory);flex-direction:column;align-items:flex-start;gap:6px;padding:12px 18px">
          <div style="display:flex;align-items:center;gap:8px;width:100%">
            <span class="card-title" style="font-size:1rem">${name}</span>
            <span style="font-size:.68rem;color:#EF4444;background:rgba(239,68,68,.08);border-radius:10px;padding:2px 8px;margin-left:auto">저점수 ${lowCount.toLocaleString()}건</span>
          </div>
          ${starDistHtml}
        </div>
        <div class="card-body" style="display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px">
          ${catCards||'<div style="font-size:.75rem;color:var(--text-lt)">해당 제품 리뷰 없음</div>'}
        </div>
        ${catData.length>0?`
        <div style="padding:0 18px 10px;font-size:.7rem;color:var(--text-lt)">
          불만 빈도 TOP 3: ${catData.slice(0,3).map(c=>`<b style="color:var(--text-md)">${c.icon} ${c.key}(${c.pct}%)</b>`).join(' → ')}
        </div>`:''}
      </div>`;
  }).join('');

  return hint + cards;
}

function buildMarketAnalysis() {
  const reviews = APP.reviews.filter(r=>num(r.rating)<=3 && r.memo !== 'placeholder');
  const crawl = (typeof REVIEW_CRAWL_DATA !== 'undefined') ? REVIEW_CRAWL_DATA : {};

  // 크롤링 데이터 기반 전체 집계 (더 정확)
  const crawlProds = Object.keys(crawl);
  const totalCrawlReviews = crawlProds.reduce((s,p)=>s+(crawl[p].total||0),0);
  const totalProds = crawlProds.length + [...new Set(reviews.map(r=>r.productName))].filter(p=>!crawlProds.includes(p)).length;

  // 카테고리별 크롤링 전체 집계
  const globalCats = COMPLAINT_CATEGORIES.map(cat=>{
    // 크롤링 데이터에서 집계
    let crawlCount = 0, crawlProdsMatched = [];
    crawlProds.forEach(pname => {
      const cd = crawl[pname].cats && crawl[pname].cats[cat.key];
      if (cd && cd.count > 0) {
        crawlCount += cd.count;
        crawlProdsMatched.push(pname);
      }
    });
    // APP.reviews 기반 제품 집계 (크롤링 없는 제품)
    const appMatched = reviews.filter(r=>
      !crawlProds.includes(r.productName) && (r.tags||[]).some(t=>cat.tags.includes(t))
    );
    const appCount = appMatched.length;
    const appProds = [...new Set(appMatched.map(r=>r.productName))];
    const totalCount = crawlCount + appCount;
    const allProds = [...new Set([...crawlProdsMatched, ...appProds])];
    const totalBase = totalCrawlReviews + reviews.filter(r=>!crawlProds.includes(r.productName)).length;
    return { ...cat, count:totalCount, productCount:allProds.length, pct: totalBase>0?Math.round(totalCount/totalBase*100*10)/10:0 };
  }).filter(c=>c.count>0).sort((a,b)=>b.count-a.count);

  const totalBase = totalCrawlReviews || reviews.length;

  // QnA 데이터
  const qnaData = [
    { keyword:'사용법', count:14, pct:48, desc:'타올드라이 후 사용, 마른모발 사용 가능 여부' },
    { keyword:'열보호·고데기', count:5, pct:17, desc:'고데기 전 사용 가능 여부, 열보호 효과' },
    { keyword:'곱슬·세팅력', count:4, pct:14, desc:'곱슬 교정, 컬 고정, 파마모 효과' },
    { keyword:'안전성', count:4, pct:14, desc:'임산부·어린이 사용 가능 여부' },
    { keyword:'실리콘 성분', count:3, pct:10, desc:'실리콘 함유 여부 직접 문의' },
    { keyword:'피부 트러블', count:3, pct:10, desc:'여드름, 피부 자극 우려' },
    { keyword:'전성분', count:3, pct:10, desc:'전성분 직접 문의 — 성분 투명성 수요' },
    { keyword:'정품 여부', count:2, pct:7, desc:'위조품 우려, 공식 판매처 확인' },
    { keyword:'용량', count:2, pct:7, desc:'더 큰 용량 요청' },
  ];

  // 제품별 크롤링 현황
  const crawlSummary = crawlProds.map(p=>({
    name: p,
    total: crawl[p].total,
    low: (crawl[p].starDist?.['1']||0) + (crawl[p].starDist?.['2']||0),
    lowPct: crawl[p].total > 0 ? Math.round(((crawl[p].starDist?.['1']||0)+(crawl[p].starDist?.['2']||0))/crawl[p].total*100) : 0
  }));

  return `
    <div style="margin-bottom:16px;background:rgba(99,102,241,.06);border-left:3px solid #6366F1;padding:8px 12px;border-radius:4px;font-size:.73rem;color:var(--text-md);line-height:1.7">
      💡 <b>현재 분석 상태:</b> 크롤링 데이터 <b>${totalCrawlReviews.toLocaleString()}건 / ${crawlProds.length}개 제품</b> 기반.
      리뷰 파일을 추가할수록 시장 전체 인사이트가 정교해집니다.
    </div>

    <!-- 크롤링 제품별 현황 -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="background:rgba(34,197,94,.06)">
        <span style="font-size:1rem">📊</span>
        <span class="card-title" style="color:#166534">리뷰 크롤링 현황</span>
      </div>
      <div class="card-body" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px">
        ${crawlSummary.map(p=>`
          <div style="border:1px solid var(--border-lt);border-radius:8px;padding:10px 14px">
            <div style="font-size:.75rem;font-weight:600;color:var(--text);margin-bottom:6px">${p.name}</div>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-size:.72rem;color:var(--text-lt)">전체 ${p.total.toLocaleString()}건</span>
              <span style="font-size:.72rem;color:#EF4444">저점수 ${p.low.toLocaleString()}건</span>
              <span style="font-size:.68rem;background:rgba(239,68,68,.1);color:#EF4444;border-radius:6px;padding:1px 6px;margin-left:auto">${p.lowPct}%</span>
            </div>
            <div style="height:4px;background:var(--border-lt);border-radius:2px;margin-top:6px">
              <div style="height:100%;width:${p.lowPct}%;background:#EF4444;border-radius:2px"></div>
            </div>
          </div>`).join('')}
      </div>
    </div>

    <!-- 불만 카테고리 전체 순위 -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="background:rgba(239,68,68,.06)">
        <span style="font-size:1rem">🔥</span>
        <span class="card-title" style="color:#991B1B">헤어에센스 시장 불만 TOP 카테고리</span>
        <span style="margin-left:auto;font-size:.7rem;color:var(--text-lt)">크롤링 전체 ${totalBase.toLocaleString()}건 기준</span>
      </div>
      <div class="card-body">
        ${globalCats.map((cat,idx)=>{
          const pct = cat.pct;
          const col = cat.color || '#6366F1';  // 카테고리 고정 색상
          return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-lt)">
            <span style="font-size:.75rem;font-weight:700;color:${col};min-width:18px">${idx+1}</span>
            <span style="font-size:.88rem">${cat.icon}</span>
            <span style="font-size:.78rem;font-weight:600;min-width:120px">${cat.key}</span>
            <div style="flex:1;background:var(--border-lt);border-radius:4px;height:8px;overflow:hidden">
              <div style="height:100%;width:${Math.min(pct,100)}%;background:${col};border-radius:4px"></div>
            </div>
            <span style="font-size:.72rem;color:${col};font-weight:700;min-width:40px;text-align:right">${pct}%</span>
            <span style="font-size:.68rem;color:var(--text-lt);min-width:70px;text-align:right">${cat.count.toLocaleString()}건/${cat.productCount}제품</span>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- 상품문의 키워드 -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="background:rgba(34,197,94,.06)">
        <span style="font-size:1rem">❓</span>
        <span class="card-title" style="color:#166534">소비자 상품문의 키워드 분석</span>
        <span style="margin-left:auto;font-size:.68rem;color:var(--text-lt)">라입 어드밴스드 2X 쿠팡 Q&A 29건 실측</span>
      </div>
      <div class="card-body">
        <div style="font-size:.7rem;color:var(--text-md);margin-bottom:12px;padding:6px 10px;background:rgba(34,197,94,.05);border-radius:4px;line-height:1.7">
          💡 소비자가 <b>구매 전 가장 궁금해하는 것</b>이 곧 마케팅 콘텐츠의 답입니다.
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px">
          ${qnaData.map((q,i)=>{
            const col=i===0?'#22C55E':i<=2?'#6366F1':'#94A3B8';
            return `<div style="border:1px solid ${col}33;border-radius:8px;padding:10px 12px;background:${col}08">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
                <span style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;color:${col}">${q.count}건</span>
                <span style="font-size:.78rem;font-weight:600">${q.keyword}</span>
                <span style="margin-left:auto;font-size:.65rem;color:${col};font-weight:600">${q.pct}%</span>
              </div>
              <div style="font-size:.67rem;color:var(--text-lt)">${q.desc}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>

    <!-- 시장 공백 기회 -->
    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="background:rgba(184,152,90,.08)">
        <span style="font-size:1rem">🎯</span>
        <span class="card-title" style="color:var(--gold-dk)">리뷰 기반 시장 공백 → 우리 브랜드 기회</span>
      </div>
      <div class="card-body">
        ${[
          {rank:1,gap:'향 설계 차별화',insight:`불만 리뷰 ${globalCats.find(c=>c.key==='향 불만')?.pct||0}%가 향 관련. "싸구려", "아저씨", "올드스파이스" 부정 이미지 집중. 클린하고 자연스러운 향 또는 무향 라인 부재.`,action:'호호바 오일 자체의 너티한 자연향 + 미니멀 향료. 무향 라인 병행 출시.'},

function openReviewForm() {
  const nr = { id:uid(), productName:'', channel:'쿠팡', rating:1, content:'', date:today(), tags:[], memo:'' };
  APP.reviews.push(nr);
  save();
  openReviewEdit(nr.id);
}

function openReviewEdit(id) {
  const r = APP.reviews.find(x => x.id === id);
  if (!r) return;
  openModal('리뷰 편집', `
    <div class="form-row-2">
      <div class="form-group"><label class="form-label">제품명</label>
        <input class="form-input" id="rev-productName" value="${r.productName}" list="comp-names">
        <datalist id="comp-names">${APP.competitors.map(c=>`<option>${c.productName}</option>`).join('')}</datalist>
      </div>
      <div class="form-group"><label class="form-label">채널</label>
        <select class="form-select" id="rev-channel">${['쿠팡','네이버쇼핑','올리브영','스마트스토어'].map(ch=>`<option${r.channel===ch?' selected':''}>${ch}</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-row-2">
      <div class="form-group"><label class="form-label">별점</label>
        <select class="form-select" id="rev-rating">${[1,2,3,4,5].map(n=>`<option value="${n}"${r.rating===n?' selected':''}>${n}점</option>`).join('')}</select>
      </div>
      <div class="form-group"><label class="form-label">작성일</label><input class="form-input" type="date" id="rev-date" value="${r.date}"></div>
    </div>
    <div class="form-group"><label class="form-label">리뷰 내용</label><textarea class="form-textarea" style="min-height:100px" id="rev-content">${r.content}</textarea></div>
    <div class="form-group"><label class="form-label">불만 태그 (복수 선택)</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${REVIEW_TAGS.map(t => `
          <label style="cursor:pointer">
            <input type="checkbox" value="${t}" ${(r.tags||[]).includes(t)?'checked':''} onchange="updateRevTag(this,'${id}')">
            <span class="tag tag-gray" style="margin-left:2px">${t}</span>
          </label>
        `).join('')}
      </div>
    </div>
    <div class="form-group"><label class="form-label">개선 메모</label><textarea class="form-textarea" id="rev-memo">${r.memo||''}</textarea></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="saveReviewEdit('${id}')">저장</button>
  `);
}

function updateRevTag(cb, id) {
  const r = APP.reviews.find(x => x.id === id);
  if (!r) return;
  if (!r.tags) r.tags = [];
  if (cb.checked) { if (!r.tags.includes(cb.value)) r.tags.push(cb.value); }
  else r.tags = r.tags.filter(t => t !== cb.value);
}

function saveReviewEdit(id) {
  const r = APP.reviews.find(x => x.id === id);
  if (!r) return;
  r.productName = document.getElementById('rev-productName').value;
  r.channel = document.getElementById('rev-channel').value;
  r.rating = num(document.getElementById('rev-rating').value);
  r.date = document.getElementById('rev-date').value;
  r.content = document.getElementById('rev-content').value;
  r.memo = document.getElementById('rev-memo').value;
  save();
  closeModal();
  navigate('reviews');
}

function deleteReview(id) {
  if (!confirm('삭제?')) return;
  APP.reviews = APP.reviews.filter(x => x.id !== id);
  save();
  navigate('reviews');
}

function openGapForm() {
  const ng = { id:uid(), gap:'', keywords:'', products:'', reviewBasis:'', solvability:'높음', devDifficulty:'낮음', differentiation:'높음', customerReaction:'', priority:'높음', apply:'검토중' };
  APP.gaps.push(ng);
  save();
  openGapEdit(ng.id);
}

function openGapEdit(id) {
  const g = APP.gaps.find(x => x.id === id);
  if (!g) return;
  const sel = (label, key, opts) => `<div class="form-group"><label class="form-label">${label}</label><select class="form-select" id="gap-${key}">${opts.map(o=>`<option${g[key]===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
  openModal('시장 공백 편집', `
    <div class="form-group"><label class="form-label">발견된 시장 공백</label><textarea class="form-textarea" id="gap-gap">${g.gap}</textarea></div>
    <div class="form-row-2">
      <div class="form-group"><label class="form-label">관련 키워드</label><input class="form-input" id="gap-keywords" value="${g.keywords}"></div>
      <div class="form-group"><label class="form-label">관련 경쟁제품</label><input class="form-input" id="gap-products" value="${g.products}"></div>
    </div>
    <div class="form-group"><label class="form-label">근거 리뷰 / 데이터</label><textarea class="form-textarea" id="gap-reviewBasis">${g.reviewBasis}</textarea></div>
    <div class="form-row">
      ${sel('해결 가능성','solvability',['높음','중간','낮음'])}
      ${sel('개발 난이도','devDifficulty',['낮음','중간','높음'])}
      ${sel('차별화 가능성','differentiation',['높음','중간','낮음'])}
      ${sel('우선순위','priority',['최우선','높음','중간','낮음'])}
      ${sel('제품 적용','apply',['예','검토중','아니오'])}
    </div>
    <div class="form-group"><label class="form-label">예상 고객 반응</label><input class="form-input" id="gap-customerReaction" value="${g.customerReaction}"></div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">취소</button>
    <button class="btn btn-primary" onclick="saveGapEdit('${id}')">저장</button>
  `);
}

function saveGapEdit(id) {
  const g = APP.gaps.find(x => x.id === id);
  if (!g) return;
  ['gap','keywords','products','reviewBasis','solvability','devDifficulty','differentiation','priority','apply','customerReaction'].forEach(k => {
    const el = document.getElementById('gap-'+k);
    if (el) g[k] = el.value;
  });
  save();
  closeModal();
  navigate('gaps');
}

function deleteGap(id) {
  if (!confirm('삭제?')) return;
  APP.gaps = APP.gaps.filter(x => x.id !== id);
  save();
  navigate('gaps');
}

  openModal('업무 편집', `

function saveTaskEdit(id) {

function deleteTask(id) {

}

/* ═══════════════════════════════════════════

// ── 자동 마이그레이션: 기존 경쟁제품에 전성분·향 데이터 자동 주입 ──
(function migrateCompetitors() {
  const fresh = defaultCompetitors();
  let changed = false;

  // 경쟁제품이 없으면 전체 교체
  if (APP.competitors.length === 0) {
    APP.competitors = fresh;
    changed = true;
  } else {
    // 기존 제품 각각에 대해 전성분·향이 없으면 기본값 주입
    APP.competitors.forEach(existing => {
      // 제품명 앞 6자 기준으로 매칭 (언어 무관)
      const match = fresh.find(f =>
        f.productName.slice(0,6) === existing.productName.slice(0,6) ||
        (existing.brand && f.brand && f.brand.slice(0,4) === existing.brand.slice(0,4))
      );
      if (!match) return;

      // 전성분 없거나 15자 미만이면 주입
      if (!existing.fullIngredients || existing.fullIngredients.trim().length < 15) {
        existing.fullIngredients = match.fullIngredients;
        changed = true;
      }
      // 향 노트 없으면 주입
      if (!existing.fragranceNotes || existing.fragranceNotes.trim().length < 5) {
        existing.fragranceNotes = match.fragranceNotes || '';
        changed = true;
      }
      // bundleInfo 없으면 주입
      if (!existing.bundleInfo && match.bundleInfo) {
        existing.bundleInfo = match.bundleInfo;
        changed = true;
      }
      // skuStrategy 없으면 주입
      if (!existing.skuStrategy && match.skuStrategy) {
        existing.skuStrategy = match.skuStrategy;
        changed = true;
      }
      // naverKeywords 없으면 주입
      if (!existing.naverKeywords && match.naverKeywords) {
        existing.naverKeywords = match.naverKeywords;
        changed = true;
      }
      // naverTags 없으면 주입
      if (!existing.naverTags && match.naverTags) {
        existing.naverTags = match.naverTags;
        changed = true;
      }
      // 제조사 정보 없으면 주입
      if (!existing.madeIn && match.madeIn) { existing.madeIn = match.madeIn; changed = true; }
      if (!existing.manufacturer && match.manufacturer) { existing.manufacturer = match.manufacturer; changed = true; }
      if (!existing.responsibleSeller && match.responsibleSeller) { existing.responsibleSeller = match.responsibleSeller; changed = true; }
    });

    // 블라세아가 없으면 추가
    const hasVlacea = APP.competitors.some(c =>
      c.productName.includes('블라세아') || (c.brand||'').includes('블라세아') || (c.brand||'').includes('Vlacea')
    );
    if (!hasVlacea) {
      const vlaceaDefault = fresh.find(f => f.brand && f.brand.includes('블라세아'));
      if (vlaceaDefault) {
        APP.competitors.push(vlaceaDefault);
        changed = true;
      }
    }

    // 화해 채널 제품이 없으면 추가
    const hasHwahae = APP.competitors.some(c => c.channel === '화해');
    if (!hasHwahae) {
      const hwahaeProds = fresh.filter(f => f.channel === '화해');
      hwahaeProds.forEach(p => APP.competitors.push(p));
      if (hwahaeProds.length > 0) changed = true;
    }
  }

  if (changed) save();
})();


// 리뷰 마이그레이션: 새로 추가된 실측 리뷰 자동 주입
(function migrateReviews() {
  const fresh = defaultReviews();
  if (APP.reviews.length === 0) {
    APP.reviews = fresh;
    save();
    return;
  }
  // 라입 2X 실측 리뷰가 없으면 주입 (구버전 → 신버전 업그레이드)
  // 라입 2X 실측 리뷰 주입
  const has2X = APP.reviews.some(r =>
    r.productName && r.productName.includes('라입 어드밴스드 2X') && r.memo && r.memo.startsWith('실제리뷰:')
  );
  if (!has2X) {
    const new2X = fresh.filter(r =>
      r.productName && r.productName.includes('라입 어드밴스드 2X') && r.memo && r.memo.startsWith('실제리뷰:')
    );
    APP.reviews = APP.reviews.filter(r =>
      !(r.productName && r.productName.includes('라입 어드밴스드 2X'))
    );
    APP.reviews = [...APP.reviews, ...new2X];
    save();
  }
  // 라입 R3 크롤링 리뷰 주입
  const hasR3crawl = APP.reviews.some(r =>
    r.productName && r.productName.includes('라입 R3') && r.memo && r.memo.startsWith('실제리뷰(크롤링)')
  );
  if (!hasR3crawl) {
    const newR3 = fresh.filter(r =>
      r.productName && r.productName.includes('라입 R3') && r.memo && r.memo.startsWith('실제리뷰(크롤링)')
    );
    APP.reviews = APP.reviews.filter(r =>
      !(r.productName && r.productName.includes('라입 R3'))
    );
    APP.reviews = [...APP.reviews, ...newR3];
    if (newR3.length > 0) save();
  }
  // REVIEW_CRAWL_DATA 기반 제품은 APP.reviews에 더미 리뷰만 유지 (별점 분포·건수는 CRAWL_DATA에서)
  // 실크테라피·라온느는 crawl data에서 직접 렌더링하므로 APP.reviews 더미 확인만
  const hasSilkCrawl = (typeof REVIEW_CRAWL_DATA!=='undefined') && REVIEW_CRAWL_DATA &&
    REVIEW_CRAWL_DATA['실크테라피 오리지널 라이트 에센스 로즈향 130ml×3'];
  const hasRaonneCrawl = (typeof REVIEW_CRAWL_DATA!=='undefined') && REVIEW_CRAWL_DATA &&
    REVIEW_CRAWL_DATA['라온느 블랙 아르간 오일 비건 헤어 오일 100ml'];
  // crawl data가 있는 제품은 APP.reviews에 placeholder 1건 추가해 product list에 노출
  ['실크테라피 오리지널 라이트 에센스 로즈향 130ml×3','라온느 블랙 아르간 오일 비건 헤어 오일 100ml','모로칸오일 트리트먼트 오리지널 125ml (모든 모발용)','미장센 퍼펙트 오리지널 세럼 80ml','어노브 실크 오일 에센스 70ml','로레알파리 엑스트라오디너리 오일세럼 (누드센트) 100ml','커리쉴 바바수오일 100ml','아도르 퍼퓸 헤어 오일 (엔젤뮤) 80ml'].forEach(pname => {
    const exists = APP.reviews.some(r=>r.productName===pname);
    if (!exists && (typeof REVIEW_CRAWL_DATA!=='undefined') && REVIEW_CRAWL_DATA && REVIEW_CRAWL_DATA[pname]) {
      APP.reviews.push({id:uid(),productName:pname,channel:'네이버쇼핑',rating:1,content:'크롤링 데이터 참조',date:'',tags:['기타'],memo:'placeholder'});
      save();
    }
  });
})();

updateBadges();
navigate('dashboard');
</script>
