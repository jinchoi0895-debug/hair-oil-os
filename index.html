<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Oil Market Strategy OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── CSS VARIABLES ────────────────────────── */
:root {
  --ivory:     #FAF8F3;
  --beige:     #F2EDE3;
  --beige-mid: #E8E0D0;
  --gold:      #B8985A;
  --gold-lt:   #D4B878;
  --gold-dk:   #8A6E35;
  --brown:     #3D2B1A;
  --brown-md:  #5C3D22;
  --brown-lt:  #8B6347;
  --text:      #2C1F10;
  --text-md:   #5C4A35;
  --text-lt:   #8B7355;
  --border:    #DDD5C0;
  --border-lt: #EDE8DC;
  --card:      #FFFFFF;
  --shadow:    0 2px 16px rgba(61,43,26,.08);
  --shadow-md: 0 4px 32px rgba(61,43,26,.14);
  --r:         10px;
  --r-sm:      6px;
  --sidebar-w: 220px;
  --header-h:  56px;
  --gold-grad: linear-gradient(135deg, #B8985A 0%, #D4B878 50%, #B8985A 100%);
  --hwahae: #00BFBF;
  --hwahae-lt: #E0F9F9;
  --hwahae-dk: #007A7A;
}

/* ── RESET & BASE ────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'DM Sans', 'Noto Sans KR', sans-serif;
  background: var(--beige);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }
a { text-decoration: none; color: inherit; }
table { border-collapse: collapse; width: 100%; }

/* ── SCROLLBAR ────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--beige); }
::-webkit-scrollbar-thumb { background: var(--gold-lt); border-radius: 3px; }

/* ── LAYOUT ───────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* TOPBAR */
#topbar {
  height: var(--header-h);
  background: var(--brown);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 100;
  flex-shrink: 0;
  border-bottom: 1px solid var(--gold-dk);
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--gold-lt);
  letter-spacing: .05em;
  white-space: nowrap;
}
.logo span { color: var(--ivory); font-weight: 300; font-style: italic; }
.topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.badge-pill {
  background: rgba(184,152,90,.25);
  color: var(--gold-lt);
  font-size: .7rem;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 1px solid rgba(184,152,90,.4);
}
.btn-icon {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.15);
  color: var(--ivory);
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem;
  transition: all .2s;
}
.btn-icon:hover { background: rgba(184,152,90,.3); border-color: var(--gold); }

/* BODY AREA */
#body-area { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-w);
  background: var(--brown);
  display: flex; flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
  border-right: 1px solid rgba(184,152,90,.2);
}
.sidebar-section { padding: 16px 0 8px; }
.sidebar-section-label {
  font-size: .65rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: rgba(212,184,120,.5);
  padding: 0 16px;
  margin-bottom: 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  color: rgba(250,248,243,.65);
  font-size: .82rem;
  font-weight: 400;
  cursor: pointer;
  transition: all .15s;
  border-left: 3px solid transparent;
  position: relative;
}
.nav-item:hover { color: var(--ivory); background: rgba(184,152,90,.1); }
.nav-item.active {
  color: var(--gold-lt);
  background: rgba(184,152,90,.15);
  border-left-color: var(--gold);
}
.nav-item .icon { width: 18px; text-align: center; font-size: .9rem; }
.nav-badge {
  margin-left: auto;
  background: var(--gold);
  color: var(--brown);
  font-size: .6rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.sidebar-bottom {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid rgba(184,152,90,.15);
  display: flex; flex-direction: column; gap: 6px;
}
.sidebar-bottom button {
  background: none; border: 1px solid rgba(184,152,90,.3);
  color: rgba(250,248,243,.55);
  padding: 7px; border-radius: var(--r-sm);
  font-size: .75rem;
  transition: all .2s;
}
.sidebar-bottom button:hover { color: var(--gold-lt); border-color: var(--gold); }

/* MAIN CONTENT */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* BREADCRUMB / SUBHEADER */
#subheader {
  background: var(--ivory);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.breadcrumb {
  font-size: .75rem;
  color: var(--text-lt);
  display: flex; align-items: center; gap: 6px;
}
.breadcrumb b { color: var(--text-md); font-weight: 600; }
.subheader-actions { margin-left: auto; display: flex; gap: 8px; }

/* PAGE CONTENT */
#page-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  background: var(--beige);
}

/* ── CARDS ────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border-lt);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-lt);
  display: flex; align-items: center; gap: 10px;
}
.card-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--brown);
}
.card-body { padding: 20px; }
.card-sm { padding: 14px 16px; }

/* ── GRID ─────────────────────────────────── */
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-auto { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }

/* ── KPI STRIP ────────────────────────────── */
.kpi-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.kpi-card {
  background: var(--card);
  border: 1px solid var(--border-lt);
  border-radius: var(--r);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--gold-grad);
}
.kpi-label { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-lt); margin-bottom: 6px; }
.kpi-value { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; color: var(--brown); line-height: 1; }
.kpi-sub { font-size: .72rem; color: var(--text-lt); margin-top: 4px; }
.kpi-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 1.6rem; opacity: .12; }

/* ── BUTTONS ──────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r-sm);
  font-size: .8rem;
  font-weight: 500;
  border: none;
  transition: all .2s;
}
.btn-primary {
  background: var(--gold-grad);
  color: var(--brown);
}
.btn-primary:hover { box-shadow: 0 4px 16px rgba(184,152,90,.4); transform: translateY(-1px); }
.btn-outline {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-md);
}
.btn-outline:hover { border-color: var(--gold); color: var(--brown); }
.btn-ghost { background: none; border: none; color: var(--text-lt); }
.btn-ghost:hover { color: var(--brown); }
.btn-danger { background: #FEE2E2; color: #B91C1C; border: 1px solid #FECACA; }
.btn-danger:hover { background: #FECACA; }
.btn-sm { padding: 5px 10px; font-size: .72rem; }
.btn-xs { padding: 3px 8px; font-size: .68rem; }

/* ── FORMS ────────────────────────────────── */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: .72rem;
  font-weight: 600;
  letter-spacing: .05em;
  color: var(--text-md);
  margin-bottom: 5px;
  text-transform: uppercase;
}
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .82rem;
  color: var(--text);
  background: var(--ivory);
  transition: border .15s;
  outline: none;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(184,152,90,.12);
}
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ── TABLE ────────────────────────────────── */
.tbl-wrap { overflow-x: auto; border-radius: var(--r); border: 1px solid var(--border-lt); }
.tbl {
  width: 100%;
  font-size: .78rem;
}
.tbl thead tr {
  background: var(--beige);
  border-bottom: 2px solid var(--border);
}
.tbl th {
  padding: 10px 12px;
  text-align: left;
  font-size: .68rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-lt);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.tbl th:hover { color: var(--brown); }
.tbl td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border-lt);
  vertical-align: middle;
  color: var(--text);
}
.tbl tr:last-child td { border-bottom: none; }
.tbl tr:hover td { background: rgba(242,237,227,.5); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.sort-icon { margin-left: 4px; opacity: .4; }
.sort-icon.asc::after { content: '↑'; }
.sort-icon.desc::after { content: '↓'; }

/* ── SCORE BADGE ──────────────────────────── */
.score-bar {
  display: flex; align-items: center; gap: 6px;
}
.score-fill {
  height: 6px; border-radius: 3px;
  background: var(--gold-grad);
  min-width: 2px;
  transition: width .3s;
}
.score-bg {
  flex: 1; height: 6px; border-radius: 3px;
  background: var(--beige-mid);
  overflow: hidden;
}
.score-num { font-size: .7rem; font-weight: 600; color: var(--gold-dk); width: 26px; text-align: right; }
.tag {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: .68rem;
  font-weight: 600;
  letter-spacing: .04em;
}
.tag-gold { background: rgba(184,152,90,.15); color: var(--gold-dk); border: 1px solid rgba(184,152,90,.3); }
.tag-green { background: #DCFCE7; color: #166534; border: 1px solid #BBF7D0; }
.tag-red { background: #FEE2E2; color: #991B1B; border: 1px solid #FECACA; }
.tag-blue { background: #DBEAFE; color: #1E40AF; border: 1px solid #BFDBFE; }
.tag-gray { background: var(--beige); color: var(--text-lt); border: 1px solid var(--border); }
.tag-brown { background: rgba(61,43,26,.08); color: var(--brown-md); border: 1px solid rgba(61,43,26,.15); }

/* ── TABS ─────────────────────────────────── */
.tab-bar {
  display: flex; gap: 2px;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
  overflow-x: auto;
}
.tab-btn {
  padding: 9px 16px;
  background: none;
  border: none;
  font-size: .8rem;
  color: var(--text-lt);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  transition: all .15s;
}
.tab-btn:hover { color: var(--brown); }
.tab-btn.active {
  color: var(--gold-dk);
  border-bottom-color: var(--gold);
  font-weight: 600;
}
.tab-btn.hwahae-tab { color: var(--hwahae-dk); }
.tab-btn.hwahae-tab.active { color: var(--hwahae-dk); border-bottom-color: var(--hwahae); }
.hwahae-highlight-box {
  background: var(--hwahae-lt);
  border: 1px solid var(--hwahae);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: .68rem;
  color: var(--hwahae-dk);
  margin-top: 6px;
  display: flex;
  align-items: flex-start;
  gap: 5px;
}

/* ── MODAL ────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(30,20,10,.55);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  backdrop-filter: blur(3px);
  animation: fadeIn .2s;
}
.modal {
  background: var(--ivory);
  border-radius: 14px;
  width: 100%; max-width: 680px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-md);
  animation: slideUp .25s;
}
.modal-lg { max-width: 900px; }
.modal-xl { max-width: 1100px; }
.modal-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; color: var(--brown); }
.modal-close {
  margin-left: auto;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: none;
  color: var(--text-lt);
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--beige); color: var(--brown); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ── IMAGE GALLERY ────────────────────────── */
.img-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.img-card {
  background: var(--beige);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.img-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); border-color: var(--gold-lt); }
.img-thumb {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}
.img-thumb-placeholder {
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--beige-mid);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  color: var(--text-lt);
}
.img-info { padding: 8px; font-size: .7rem; color: var(--text-md); }
.img-tag { font-size: .62rem; }
.img-overlay {
  position: absolute; inset: 0;
  background: rgba(61,43,26,.7);
  opacity: 0;
  transition: .2s;
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 1.2rem;
}
.img-card:hover .img-overlay { opacity: 1; }

/* ── DROP ZONE ────────────────────────────── */
.drop-zone {
  border: 2px dashed var(--gold-lt);
  border-radius: var(--r);
  padding: 30px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  background: rgba(184,152,90,.03);
}
.drop-zone:hover, .drop-zone.dragging {
  background: rgba(184,152,90,.08);
  border-color: var(--gold);
}
.drop-zone-icon { font-size: 2rem; color: var(--gold-lt); margin-bottom: 8px; }
.drop-zone-text { font-size: .82rem; color: var(--text-lt); }

/* ── POSITIONING MAP ──────────────────────── */
.pos-map {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  max-width: 500px;
  margin: 0 auto;
  background: var(--ivory);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: visible;
}
.pos-axis-x, .pos-axis-y {
  position: absolute;
  background: var(--border);
}
.pos-axis-x { left: 10%; right: 10%; top: 50%; height: 1px; }
.pos-axis-y { top: 10%; bottom: 10%; left: 50%; width: 1px; }
.pos-dot {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
}
.pos-dot-circle {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
}
.pos-dot-label {
  font-size: .6rem;
  white-space: nowrap;
  background: rgba(255,255,255,.9);
  padding: 1px 5px;
  border-radius: 10px;
  margin-top: 3px;
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}
.axis-label {
  position: absolute;
  font-size: .65rem;
  color: var(--text-lt);
  font-weight: 600;
  letter-spacing: .05em;
}

/* ── STATUS BADGE ─────────────────────────── */
.status { display: inline-flex; align-items: center; gap: 4px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; }
.status-미시작 .status-dot { background: #94A3B8; }
.status-자료수집중 .status-dot { background: #F59E0B; }
.status-분석중 .status-dot { background: #3B82F6; }
.status-검토필요 .status-dot { background: #EF4444; }
.status-완료 .status-dot { background: #22C55E; }

/* ── FLOW CONNECTOR ───────────────────────── */
.flow-strip {
  display: flex; align-items: center;
  gap: 0;
  overflow-x: auto;
  padding: 12px 0;
  margin-bottom: 20px;
}
.flow-step {
  display: flex; align-items: center; gap: 0;
  flex-shrink: 0;
}
.flow-node {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: .72rem;
  font-weight: 600;
  color: var(--text-md);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.flow-node:hover, .flow-node.active {
  background: var(--brown);
  color: var(--gold-lt);
  border-color: var(--brown);
}
.flow-arrow { color: var(--gold-lt); margin: 0 4px; font-size: .8rem; }

/* ── REVIEW CARD ──────────────────────────── */
.review-card {
  background: var(--ivory);
  border: 1px solid var(--border-lt);
  border-radius: var(--r-sm);
  padding: 14px 16px;
  margin-bottom: 10px;
}
.review-stars { color: var(--gold); font-size: .85rem; margin-bottom: 6px; }
.review-text { font-size: .82rem; line-height: 1.6; color: var(--text); }
.review-meta { margin-top: 8px; font-size: .68rem; color: var(--text-lt); display: flex; gap: 10px; }
.review-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }

/* ── MISC ─────────────────────────────────── */
.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.4rem;
  font-weight: 600;
  color: var(--brown);
  margin-bottom: 4px;
}
.section-sub { font-size: .78rem; color: var(--text-lt); margin-bottom: 16px; }
.divider { border: none; border-top: 1px solid var(--border-lt); margin: 20px 0; }
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-lt);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .4; }
.empty-state p { font-size: .85rem; }
.img-hover-overlay { pointer-events: none; }
.img-card > div:first-child:hover .img-hover-overlay { opacity: 1; }
.tooltip::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--brown);
  color: var(--ivory);
  font-size: .65rem;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function today() { return new Date().toISOString().slice(0,10); }
function num(v) { return Number(v) || 0; }
function fmt(n) { return Number(n).toLocaleString(); }
function pct(n) { return Number(n).toFixed(1) + '%'; }

/* Score calculation */
function calcScores(kw) {
  const search = Math.min(num(kw.monthlySearch) / 40000, 1);
  const comp   = 1 - Math.min(num(kw.competition) / 150, 1);
  const prodQ  = 1 - Math.min(num(kw.productCount) / 300000, 1);
  const femS   = Math.min(num(kw.femaleRatio) / 100, 1);
  const priceS = Math.min(num(kw.avgPrice) / 30000, 1);

  const marketScore   = Math.round(search * 100);
  const compScore     = Math.round(comp * 100);
  const entryScore    = Math.round((comp * .5 + prodQ * .5) * 100);
  const brandScore    = Math.round((femS * .4 + priceS * .3 + comp * .3) * 100);
  const priorityScore = Math.round((search * .3 + comp * .3 + entryScore/100 * .2 + brandScore/100 * .2) * 100);
  return { marketScore, compScore, entryScore, brandScore, priorityScore };
}

/* Competition strength label */
function compLabel(v) {
  if (v < 15) return ['tag-green','낮음'];
  if (v < 50) return ['tag-gold','중간'];
  if (v < 100) return ['tag-red','높음'];
  return ['tag-red','매우높음'];
}

/* Stars */
function stars(n) {
  const full = Math.round(num(n));
  return '★'.repeat(Math.min(full,5)) + '☆'.repeat(Math.max(0,5-full));
}

function showKwTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  ['table','chart','scores','report'].forEach(t => {
    const el = document.getElementById('kw-tab-'+t);
    if (el) el.style.display = t === tab ? '' : 'none';
  });
  if (tab === 'chart') { setTimeout(() => drawKwCharts(APP.keywords), 50); }
  if (tab === 'report') { setTimeout(() => drawReportCharts(APP.keywords), 80); }
}

function drawKwCharts(kws) {
  const names = kws.map(k => k.name);
  const COLORS = ['#B8985A','#8B6347','#D4B878','#5C3D22'];
  const BG = ['#B8985A99','#8B634799','#D4B87899','#5C3D2299'];

  const mk = (id, type, labels, datasets, extraOpts={}) => {
    const el = document.getElementById(id);
    if (!el) return null;
    const ex = Chart.getChart(el); if (ex) ex.destroy();
    return new Chart(el, {
      type, data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { font:{size:11}, color:'#5C4A35' } }, tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${Number(ctx.raw).toLocaleString()}` } } },
        scales: { x: { ticks:{color:'#8B7355',font:{size:10}} }, y: { ticks:{color:'#8B7355',font:{size:10}} } },
        ...extraOpts
      }
    });
  };

  // 1. 월 검색수
  mk('chart-search', 'bar', names, [{
    label:'월 검색수', data: kws.map(k=>k.monthlySearch), backgroundColor: BG, borderColor: COLORS, borderWidth: 1.5, borderRadius: 4
  }]);

  // 2. 경쟁강도 — 낮을수록 좋으므로 색 반전
  mk('chart-comp', 'bar', names, [{
    label:'경쟁강도 (낮을수록 진입 유리)', data: kws.map(k=>k.competition),
    backgroundColor: kws.map(k => k.competition<15?'#22C55E99':k.competition<50?'#F59E0B99':'#EF444499'),
    borderColor:     kws.map(k => k.competition<15?'#22C55E':k.competition<50?'#F59E0B':'#EF4444'),
    borderWidth: 1.5, borderRadius: 4
  }], { plugins: { legend:{ labels:{font:{size:11},color:'#5C4A35'} }, annotation:{} }, scales:{ x:{ticks:{color:'#8B7355',font:{size:10}}}, y:{ticks:{color:'#8B7355',font:{size:10}}, title:{display:true,text:'경쟁강도 수치',color:'#8B7355'}} } });

  // 3. 산점도
  const scEl = document.getElementById('chart-scatter');
  if (scEl) {
    const ex = Chart.getChart(scEl); if (ex) ex.destroy();
    new Chart(scEl, {
      type: 'scatter',
      data: { datasets: kws.map((k,i) => ({ label: k.name, data: [{x:k.monthlySearch, y:k.productCount}], backgroundColor: COLORS[i]+'CC', pointRadius: 14, pointHoverRadius: 16 })) },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend:{labels:{font:{size:11},color:'#5C4A35'}}, tooltip:{callbacks:{label: ctx => ` ${ctx.dataset.label} — 검색:${Number(ctx.raw.x).toLocaleString()} / 상품:${Number(ctx.raw.y).toLocaleString()}`}} },
        scales: {
          x: { title:{display:true,text:'← 검색량 적음 | 검색량 많음 →',color:'#8B7355'}, ticks:{color:'#8B7355',font:{size:10}} },
          y: { title:{display:true,text:'↑ 상품 많음(경쟁↑)\n↓ 상품 적음(기회↑)',color:'#8B7355'}, ticks:{color:'#8B7355',font:{size:10}} }
        }
      }
    });
  }

  // 4. 평균가 비교
  mk('chart-price', 'bar', names, [{
    label:'평균 판매가(원)', data: kws.map(k=>k.avgPrice), backgroundColor: BG, borderColor: COLORS, borderWidth:1.5, borderRadius:4
  }], { scales:{ x:{ticks:{color:'#8B7355',font:{size:10}}}, y:{ticks:{color:'#8B7355',font:{size:10},callback:v=>'₩'+Number(v).toLocaleString()}} } });

  // 5. 트렌드 (1년 기본, switchTrend로 전환)
  drawTrendChart(kws, '1y');
}

  files.filter(f => f.type.startsWith('image/')).forEach(file => {

      navigate('images');
    };
    reader.readAsDataURL(file);
  });
}

function renderManufacturer(container) {
  document.getElementById('subheader-actions').innerHTML = '';
  const all = APP.competitors;

  function normKey(s) {
    if (!s) return '';
    return s.replace(/㈜/g,'(주)').replace(/\s+/g,'')
      .replace(/\(주\)/gi,'').replace(/주식회사/gi,'')
      .replace(/\(이스라엘\)|\(자체.*?\)|\(공식.*?\)/g,'')
      .replace(/Ltd\.|Inc\.|Co\./gi,'').replace(/[()]/g,'')
      .trim().toLowerCase();
  }

  const mfgMap = {};
  all.forEach(c => {
    const raw = c.manufacturer || '';
    const key = raw ? normKey(raw) : '__없음__';
    if (!mfgMap[key]) mfgMap[key] = { display: raw || '미입력', products: [] };
    mfgMap[key].products.push(c);
  });

  const sellerMap = {};
  all.forEach(c => {
    const raw = c.responsibleSeller || '';
    const key = raw ? normKey(raw) : '__없음__';
    if (!sellerMap[key]) sellerMap[key] = { display: raw || '미입력', products: [] };
    sellerMap[key].products.push(c);
  });

  const countryMap = {};
  all.forEach(c => {
    const key = c.madeIn || '미입력';
    if (!countryMap[key]) countryMap[key] = [];
    countryMap[key].push(c);
  });

  const chColor = ch => ({'쿠팡':'#EF4444','네이버쇼핑':'#22C55E','스마트스토어':'#22C55E','올리브영':'#F59E0B','화해':'#00BFBF'}[ch] || '#94A3B8');
  const chTag = c => `<span style="background:${chColor(c.channel)}22;color:${chColor(c.channel)};border:1px solid ${chColor(c.channel)}44;border-radius:20px;padding:1px 7px;font-size:.6rem;font-weight:600">${c.channel}</span>`;
  const prodPill = c => `<div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--ivory);border:1px solid var(--border-lt);border-radius:6px;margin-bottom:4px">${chTag(c)}<span style="font-size:.75rem;font-weight:500;flex:1">${c.productName}</span><span style="font-size:.68rem;color:var(--text-lt)">${c.brand}</span>${c.price?`<span style="font-size:.68rem;color:var(--gold-dk);font-weight:600">₩${Number(c.price).toLocaleString()}</span>`:''}</div>`;

  const dupMfg = Object.entries(mfgMap).filter(([k,v])=>k!=='__없음__'&&v.products.length>=2).sort((a,b)=>b[1].products.length-a[1].products.length);
  const dupSeller = Object.entries(sellerMap).filter(([k,v])=>k!=='__없음__'&&v.products.length>=2).sort((a,b)=>b[1].products.length-a[1].products.length);
  const noInfoCount = all.filter(c=>!c.madeIn&&!c.manufacturer&&!c.responsibleSeller).length;
  const uniqueMfg = Object.keys(mfgMap).filter(k=>k!=='__없음__').length;
  const uniqueSeller = Object.keys(sellerMap).filter(k=>k!=='__없음__').length;

  container.innerHTML = `
    <div class="section-title">🏭 제조사 분석</div>

/* ─── 전성분 파싱 유틸 ─── */
function parseIngredients(raw) {
  if (!raw) return [];
  return raw.split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
}

function normalizeIng(s) {
  return s.toLowerCase()
    .replace(/\s+/g,'')
    .replace(/[()（）\[\]]/g,'')
    .replace(/[0-9.%]/g,'');
}

/* ─── 전성분 비교 분석 렌더러 ─── */
function renderIngredientAnalysis(comps) {
  const withIngs = comps.filter(c => c.fullIngredients && c.fullIngredients.trim());

  if (withIngs.length === 0) {
    return `<div class="empty-state" style="padding:48px">
      <div class="empty-icon">🧪</div>
      <p>전성분이 입력된 제품이 없습니다.<br>각 제품 상세 편집 탭에서 <b>전성분</b>을 입력해주세요.</p>
    </div>`;
  }

  // 각 제품의 성분 배열 파싱 (향별 분리 [텐더블룸] 등 첫 번째 향만 사용)
  const parsed = withIngs.map(c => {
    // 다향 제품의 경우 첫 번째 [ ] 블록 분리
    let raw = c.fullIngredients || '';
    const bracketMatch = raw.match(/\[([^\]]+)\]\s*([^[]+)/);
    const mainIng = bracketMatch ? bracketMatch[2] : raw;
    const ings = parseIngredients(mainIng);
    return {
      id: c.id, name: c.productName, brand: c.brand,
      channel: c.channel || '기타',
      price: c.price, volume: c.volume,
      hasSilicone: c.hasSilicone,
      hasPlantOil: c.hasPlantOil,
      hasProtein: c.hasProtein,
      fragranceNotes: c.fragranceNotes,
      fragranceType: c.fragranceType,
      rawIng: raw,
      ings: ings,
      normed: ings.map(normalizeIng)
    };
  });

  // 채널 목록
  const channels = ['쿠팡','네이버쇼핑','올리브영','화해'];

  // 전체 성분 정규화 맵
  const allNormed = {};
  parsed.forEach(p => p.ings.forEach((ing, i) => {
    const n = p.normed[i];
    if (!allNormed[n]) allNormed[n] = ing;
  }));

  // 전체 겹침 빈도
  const ingFreq = {};
  Object.keys(allNormed).forEach(n => {
    ingFreq[n] = parsed.filter(p => p.normed.includes(n)).length;
  });

  const sortedFreq = Object.entries(ingFreq).sort((a,b)=>b[1]-a[1]);
  const commonIngs = sortedFreq.filter(([,cnt]) => cnt >= 2);
  const uniqueIngs = sortedFreq.filter(([,cnt]) => cnt === 1);

  // 성분 카테고리 자동 분류 (키워드 기반)
  const CATS = [
    { name:'용매·기제', color:'#94A3B8', bg:'rgba(148,163,184,.12)', kw:['water','aqua','정제수','에탄올','변성알코올','프로판다이올','부틸렌글라이콜','펜틸렌글라이콜','글리세린','정제수'] },
    { name:'실리콘류', color:'#EF4444', bg:'rgba(239,68,68,.1)', kw:['실록세인','실리콘','사이클로펜타실록세인','사이클로헥사실록세인','사이클로테트라실록세인','다이메티콘','다이메치콘','디메치콘','디메티콘','다이메티콘올','다이실록세인','다이아미터콘','아모다이메티콘','트라이실록세인','사이클로매치콘','사이클로메치콘','폴리다이메틸실록시','실세스퀴옥세인','카프릴릴메티콘','dimethicone','cyclomethicone','cyclopentasiloxane','cyclohexasiloxane','phenyl','trimethicone','amodimethicone','siloxane','silsesquioxane'] },
    { name:'식물성 오일', color:'#22C55E', bg:'rgba(34,197,94,.1)', kw:['oil','오일','jojoba','argan','camellia','olive','sunflower','coconut','squalane','marula','macadamia','moringa','rosehip'] },
    { name:'에모리엔트·에스터', color:'#A78BFA', bg:'rgba(167,139,250,.1)', kw:['isopropyl','cetyl','myristyl','stearyl','ester','ethylhexyl','caprylic','capric','adipate','isostearate'] },
    { name:'계면활성제', color:'#F59E0B', bg:'rgba(245,158,11,.1)', kw:['peg','ppg','cetearyl','steareth','laureth','polysorbate','behentrimonium','cetrimonium'] },
    { name:'단백질·아미노산', color:'#B8985A', bg:'rgba(184,152,90,.12)', kw:['protein','amino','keratin','silk','collagen','hydrolyzed','peptide','단백질'] },
    { name:'보습·습윤제', color:'#38BDF8', bg:'rgba(56,189,248,.1)', kw:['glycerin','glycerine','hyaluronic','sodium','panthenol','betaine','trehalose','sorbitol','mannitol','ceramide'] },
    { name:'향료·향', color:'#F472B6', bg:'rgba(244,114,182,.1)', kw:['fragrance','parfum','향료','linalool','limonene','geraniol','citronellol','benzyl','eugenol'] },
    { name:'보존제·항균', color:'#FB923C', bg:'rgba(251,146,60,.1)', kw:['paraben','phenoxyethanol','methylchloroisothiazolinone','benzoate','sorbate','dehydroacetic','caprylyl'] },
    { name:'산화방지·안정제', color:'#10B981', bg:'rgba(16,185,129,.1)', kw:['tocopherol','ascorbic','bha','bht','citric','disodium','tetrasodium','edta'] },
  ];

  function classifyIng(ingName) {
    const lower = ingName.toLowerCase().replace(/\s/g,'');
    for (const cat of CATS) {
      if (cat.kw.some(k => lower.includes(k))) return cat;
    }
    return { name:'기타', color:'#6B7280', bg:'rgba(107,114,128,.08)' };
  }

  return `
    <!-- 헤더 요약 -->
    <div style="background:var(--brown);color:var(--ivory);border-radius:10px;padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <span style="font-size:1.4rem">🧪</span>
      <div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:600;color:var(--gold-lt)">채널별 전성분 · 향 분석표</div>
        <div style="font-size:.7rem;color:rgba(250,248,243,.5)">${withIngs.length}개 제품 · 전체 성분 ${Object.keys(allNormed).length}종 · 2개↑ 공통 성분 ${commonIngs.length}종</div>
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
        <span style="background:rgba(34,197,94,.2);color:#86EFAC;border-radius:6px;padding:3px 10px;font-size:.68rem;font-weight:600">공통 ${commonIngs.length}종</span>
        <span style="background:rgba(239,68,68,.2);color:#FCA5A5;border-radius:6px;padding:3px 10px;font-size:.68rem;font-weight:600">단독 ${uniqueIngs.length}종</span>
      </div>
    </div>

    <!-- 범례 -->
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding:10px 14px;background:var(--ivory);border-radius:8px;border:1px solid var(--border-lt)">
      <span style="font-size:.68rem;color:var(--text-lt);margin-right:4px;align-self:center">성분 카테고리:</span>
      ${CATS.map(cat=>`<span style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}66;border-radius:12px;padding:2px 8px;font-size:.64rem;font-weight:600">${cat.name}</span>`).join('')}
      <span style="background:rgba(107,114,128,.08);color:#6B7280;border:1px solid #6B728066;border-radius:12px;padding:2px 8px;font-size:.64rem">기타</span>
      <span style="margin-left:8px;font-size:.68rem;color:var(--text-lt);align-self:center">│ <b>굵은 테두리</b> = 2개↑ 제품 공통 성분</span>
    </div>

    <!-- ═══ 채널별 섹션 ═══ -->
    ${channels.map(ch => {
      const chProds = parsed.filter(p => p.channel === ch);
      if (chProds.length === 0) return '';

      // 채널 내 공통 성분 계산
      const chFreq = {};
      Object.keys(allNormed).forEach(n => {
        const cnt = chProds.filter(p => p.normed.includes(n)).length;
        if (cnt > 0) chFreq[n] = cnt;
      });
      const chCommon = Object.entries(chFreq).filter(([,cnt])=>cnt>=2).sort((a,b)=>b[1]-a[1]);
      const chSilCommon = chCommon.filter(([n])=>classifyIng(allNormed[n]).name==='실리콘류');
      const chOilCommon = chCommon.filter(([n])=>classifyIng(allNormed[n]).name==='식물성 오일');

      const chColor = ch==='쿠팡'?'#EF4444':ch==='네이버쇼핑'?'#22C55E':'#F59E0B';
      const chIcon  = ch==='쿠팡'?'🛒':ch==='네이버쇼핑'?'🏪':'🌿';

      return `
      <div style="margin-bottom:28px">
        <!-- 채널 타이틀 -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;background:${chColor}18;border-left:4px solid ${chColor};border-radius:0 8px 8px 0">
          <span style="font-size:1rem">${chIcon}</span>
          <span style="font-size:.95rem;font-weight:700;color:${chColor}">${ch}</span>
          <span style="font-size:.72rem;color:var(--text-lt)">${chProds.length}개 제품 분석</span>
          <span style="margin-left:auto;font-size:.68rem;background:${chColor}22;color:${chColor};border-radius:6px;padding:2px 8px;font-weight:600">채널 내 공통 성분 ${chCommon.length}종</span>
        </div>

        <!-- 제품 카드 목록 -->
        ${chProds.map((p,pi) => {
          // 향 정보 파싱
          let fragHtml = '';
          try {
            const fn = JSON.parse(p.fragranceNotes||'{}');
            if (fn.scents && fn.scents.length) {
              fragHtml = fn.scents.map(s=>`
                <div style="margin-bottom:8px">
                  ${fn.hasMultiScent ? `<div style="font-size:.68rem;font-weight:700;color:var(--gold-dk);margin-bottom:3px">🌸 ${s.name}</div>` : ''}
                  <div style="display:grid;grid-template-columns:40px 1fr;gap:3px 8px;font-size:.68rem">
                    <span style="color:var(--text-lt);font-weight:600">Top</span><span>${s.top||'–'}</span>
                    <span style="color:var(--text-lt);font-weight:600">Mid</span><span>${s.middle||'–'}</span>
                    <span style="color:var(--text-lt);font-weight:600">Base</span><span>${s.base||'–'}</span>
                  </div>
                  ${s.overall ? `<div style="font-size:.64rem;color:var(--text-lt);margin-top:3px;line-height:1.4">${s.overall}</div>` : ''}
                </div>
              `).join('');
            }
          } catch(e) {}

          // 다향 제품인지
          const isMulti = (p.rawIng||'').includes('[');
          const allScents = [];
          if (isMulti) {
            const matches = [...(p.rawIng||'').matchAll(/\[([^\]]+)\]\s*([^[]+)/g)];
            matches.forEach(m => allScents.push({ label: m[1], ings: parseIngredients(m[2]) }));
          }

          return `
          <div style="border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden">
            <!-- 제품 헤더 -->
            <div style="background:var(--beige);padding:10px 14px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--border-lt)">
              <span style="background:${chColor};color:white;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0">${pi+1}</span>
              <div style="flex:1">
                <div style="font-size:.8rem;font-weight:700;color:var(--brown);line-height:1.3">${p.name}</div>

              <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:flex-start">
                ${p.volume?`<span style="background:var(--ivory);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:.66rem;font-weight:600">${p.volume}ml</span>`:''}

                <span class="tag ${p.hasSilicone==='예'?'tag-red':'tag-green'}" style="font-size:.62rem">${p.hasSilicone==='예'?'실리콘 포함':'무실리콘'}</span>
                <span class="tag ${p.hasPlantOil==='예'?'tag-green':'tag-gray'}" style="font-size:.62rem">${p.hasPlantOil==='예'?'식물성 오일':'오일 없음'}</span>
                <span class="tag ${p.hasProtein==='예'?'tag-gold':'tag-gray'}" style="font-size:.62rem">${p.hasProtein==='예'?'단백질 포함':'단백질 없음'}</span>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0">
              <!-- 왼쪽: 향 -->
              <div style="padding:12px 14px;border-right:1px solid var(--border-lt)">
                <div style="font-size:.68rem;font-weight:700;color:var(--gold-dk);margin-bottom:8px;display:flex;align-items:center;gap:4px">
                  🌸 향 (Top / Middle / Base)
                </div>
                ${fragHtml || `<div style="font-size:.7rem;color:var(--text-lt)">${p.fragranceType||'–'}</div>`}
              </div>

              <!-- 오른쪽: 전성분 -->
              <div style="padding:12px 14px">
                <div style="font-size:.68rem;font-weight:700;color:var(--gold-dk);margin-bottom:8px">
                  🧪 전성분 ${isMulti?'(향별 복수)':''}
                  <span style="font-weight:400;color:var(--text-lt);margin-left:4px">${p.ings.length}종${isMulti?` (${allScents.length}향)`:''}</span>
                </div>
                ${isMulti ? allScents.map(sc=>`
                  <div style="margin-bottom:8px">
                    <div style="font-size:.64rem;font-weight:700;color:var(--text-lt);margin-bottom:4px">[${sc.label}] — ${sc.ings.length}종</div>
                    <div style="display:flex;flex-wrap:wrap;gap:3px">
                      ${sc.ings.map(ing=>{
                        const cat=classifyIng(ing);
                        const freq=ingFreq[normalizeIng(ing)]||1;
                        const isCom=freq>=2;
                        return `<span title="${cat.name}·${freq}개 제품" style="background:${cat.bg};color:${cat.color};border:${isCom?'2px solid '+cat.color:'1px solid '+cat.color+'44'};border-radius:12px;font-size:.6rem;padding:1px 6px;font-weight:${isCom?'700':'400'}">${ing}${isCom?'✦':''}</span>`;
                      }).join('')}
                    </div>
                  </div>
                `).join('') : `
                  <div style="display:flex;flex-wrap:wrap;gap:3px">
                    ${p.ings.map((ing,idx)=>{
                      const cat=classifyIng(ing);
                      const freq=ingFreq[p.normed[idx]]||1;
                      const isCom=freq>=2;
                      return `<span title="${cat.name}·${freq}개 제품 공통" style="background:${cat.bg};color:${cat.color};border:${isCom?'2px solid '+cat.color:'1px solid '+cat.color+'44'};border-radius:12px;font-size:.6rem;padding:1px 6px;font-weight:${isCom?'700':'400'}">${ing}${isCom?'✦':''}</span>`;
                    }).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>`;
        }).join('')}

        <!-- 채널 내 공통 성분 요약 -->
        <div style="background:${chColor}08;border:1.5px solid ${chColor}44;border-radius:10px;padding:14px 16px;margin-top:4px">
          <div style="font-size:.72rem;font-weight:700;color:${chColor};margin-bottom:10px">
            📊 ${ch} 채널 — 공통 성분 분석 (${chProds.length}개 제품 중 2개↑ 포함)
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px">
            <!-- 실리콘 공통 -->
            <div style="background:rgba(239,68,68,.06);border-radius:8px;padding:8px 10px">
              <div style="font-size:.64rem;color:#EF4444;font-weight:700;margin-bottom:5px">🔴 실리콘류 공통</div>
              ${chSilCommon.length ? chSilCommon.map(([n,cnt])=>`
                <div style="display:flex;justify-content:space-between;font-size:.67rem;margin-bottom:3px">
                  <span style="color:var(--text)">${allNormed[n]}</span>
                  <span style="color:#EF4444;font-weight:700">${cnt}/${chProds.length}</span>
                </div>`).join('') : '<div style="font-size:.67rem;color:var(--text-lt)">공통 실리콘 없음</div>'}
            </div>
            <!-- 식물성 오일 공통 -->
            <div style="background:rgba(34,197,94,.06);border-radius:8px;padding:8px 10px">
              <div style="font-size:.64rem;color:#22C55E;font-weight:700;margin-bottom:5px">🟢 식물성 오일 공통</div>
              ${chOilCommon.length ? chOilCommon.slice(0,6).map(([n,cnt])=>`
                <div style="display:flex;justify-content:space-between;font-size:.67rem;margin-bottom:3px">
                  <span style="color:var(--text)">${allNormed[n]}</span>
                  <span style="color:#22C55E;font-weight:700">${cnt}/${chProds.length}</span>
                </div>`).join('') : '<div style="font-size:.67rem;color:var(--text-lt)">공통 식물성 오일 없음</div>'}
            </div>
            <!-- 기타 공통 TOP -->
            <div style="background:rgba(184,152,90,.06);border-radius:8px;padding:8px 10px">
              <div style="font-size:.64rem;color:var(--gold-dk);font-weight:700;margin-bottom:5px">⭐ 기타 공통 TOP</div>
              ${chCommon.filter(([n])=>{const c=classifyIng(allNormed[n]).name; return c!=='실리콘류'&&c!=='식물성 오일';}).slice(0,6).map(([n,cnt])=>{
                const cat=classifyIng(allNormed[n]);
                return `<div style="display:flex;justify-content:space-between;font-size:.67rem;margin-bottom:3px">
                  <span style="color:${cat.color}">${allNormed[n]}</span>
                  <span style="color:var(--gold-dk);font-weight:700">${cnt}/${chProds.length}</span>
                </div>`;
              }).join('')||'<div style="font-size:.67rem;color:var(--text-lt)">–</div>'}
            </div>
          </div>
          <!-- 채널 소비자 인사이트 -->
          <div style="font-size:.68rem;color:var(--text-md);padding:8px 10px;background:white;border-radius:6px;line-height:1.6">
            ${{
              '쿠팡':'💡 <b>소비자 심리:</b> 가격·리뷰 수가 첫 번째 구매 기준. 사이클로펜타실록세인·다이메티콘 실리콘 베이스가 채널 표준 — 끈적임 없이 빠른 코팅감 선호. 아르간오일 ppm 수치 비교로 "성분 가성비" 탐색. 짝퉁·위조품 주의로 로켓배송 신뢰도 중시.',
              '네이버쇼핑':'💡 <b>소비자 심리:</b> 브랜드 스토리·성분 투명성이 구매 결정 핵심. 무실리콘·클린뷰티 포지셔닝에 민감. 상세페이지 읽는 성분 탐구형 소비자 비율 높음. 향 계열보다 기능성(손상케어·단백질) 우선.',
              '올리브영':'💡 <b>소비자 심리:</b> 향·제형 직접 체험이 구매 전환 핵심. 퍼퓸 오일로 향수 대용 트렌드 뚜렷. 아도르·어노브처럼 향 라인업 다양화 전략이 유효. 오프라인 매장 방문 → 향 체험 → 온라인 재구매 패턴.'
            }[ch]||''}
          </div>
        </div>
      </div>`;
    }).join('')}

    <!-- ═══ 전체 채널 통합 공통 성분 ═══ -->
    <div class="card" style="margin-top:8px">
      <div class="card-header" style="background:rgba(184,152,90,.08)">
        <span style="font-size:1rem">🔗</span>
        <span class="card-title">전 채널 통합 — 2개↑ 제품 공통 성분 (${commonIngs.length}종)</span>
        <span style="margin-left:auto;font-size:.68rem;color:var(--text-lt)">굵을수록 많은 제품에 공통 포함</span>
      </div>
      <div class="card-body">
        ${['실리콘류','식물성 오일','단백질·아미노산','보습·습윤제','향료·향','에모리엔트·에스터','보존제·항균','기타'].map(catName => {
          const inThisCat = commonIngs.filter(([n])=>classifyIng(allNormed[n]).name===catName);
          if (!inThisCat.length) return '';
          const cat = CATS.find(c=>c.name===catName) || {color:'#6B7280',bg:'rgba(107,114,128,.08)'};
          return `
            <div style="margin-bottom:12px">
              <div style="font-size:.68rem;font-weight:700;color:${cat.color};margin-bottom:5px;display:flex;align-items:center;gap:6px">
                <div style="width:8px;height:8px;border-radius:2px;background:${cat.color};flex-shrink:0"></div>
                ${catName} (${inThisCat.length}종)
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${inThisCat.map(([n,cnt])=>{
                  const total = parsed.length;
                  const sz = cnt>=Math.ceil(total*0.7)?'700':cnt>=Math.ceil(total*0.4)?'600':'400';
                  return `<span title="${cnt}/${total} 제품 공통" style="background:${cat.bg};color:${cat.color};border:1.5px solid ${cat.color}${cnt>=3?'cc':'44'};border-radius:20px;font-size:.66rem;padding:2px 9px;font-weight:${sz}">
                    ${allNormed[n]} <span style="opacity:.7;font-size:.58rem">${cnt}/${total}</span>
                  </span>`;
                }).join('')}
              </div>
            </div>`;
        }).join('')}
        ${commonIngs.filter(([n])=>{
          const c=classifyIng(allNormed[n]).name;
          return !['실리콘류','식물성 오일','단백질·아미노산','보습·습윤제','향료·향','에모리엔트·에스터','보존제·항균'].includes(c);
        }).length ? '' : ''}
      </div>
    </div>

    <!-- 미입력 안내 -->
    ${comps.filter(c => !c.fullIngredients || !c.fullIngredients.trim()).length > 0 ? `
    <div style="margin-top:12px;background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;font-size:.75rem;color:#92400E">
      ⚠️ <b>전성분 미입력 ${comps.filter(c => !c.fullIngredients || !c.fullIngredients.trim()).length}개:</b>
      ${comps.filter(c => !c.fullIngredients || !c.fullIngredients.trim()).map(c => `<button class="btn btn-xs btn-outline" style="margin:2px" onclick="openCompDetail('${c.id}')">${c.productName.slice(0,16)}</button>`).join('')}
    </div>` : ''}

    <!-- ═══ 유사 전성분 구조 클러스터링 ═══ -->
    ${(() => {
      // 전체 성분 기반 Jaccard 유사도 (주성분 포함 전체 비교)
      if (parsed.length < 2) return '';

      // 각 제품의 전체 정규화 성분 집합
      const allSets = parsed.map(p => ({
        id: p.id, name: p.name, brand: p.brand,
        fullSet: new Set(p.normed),
        // 향료 성분(리날룰·리모넨 등 알레르기 성분) 제외한 집합도 준비
        baseSet: new Set(p.normed.filter(n => {
          const cat = classifyIng(allNormed[n] || n).name;
          return cat !== '향료·향';
        }))
      }));

      // 모든 쌍에 대해 Jaccard 계산 (전체 성분 기준 + 향료 제외 기준 모두)
      const pairs = [];
      for (let i = 0; i < allSets.length; i++) {
        for (let j = i + 1; j < allSets.length; j++) {
          const A = allSets[i].fullSet;
          const B = allSets[j].fullSet;
          const Ab = allSets[i].baseSet;
          const Bb = allSets[j].baseSet;

          if (A.size === 0 || B.size === 0) continue;

          // 전체 성분 Jaccard
          const inter = new Set([...A].filter(x => B.has(x)));
          const union = new Set([...A, ...B]);
          const jaccard = inter.size / union.size;

          // 베이스(향료 제외) Jaccard — 포뮬러 구조 유사도
          const interB = new Set([...Ab].filter(x => Bb.has(x)));
          const unionB = new Set([...Ab, ...Bb]);
          const jaccardBase = unionB.size > 0 ? interB.size / unionB.size : 0;

          if (jaccard >= 0.15 || jaccardBase >= 0.2) {
            const sharedIngs = [...inter].map(n => allNormed[n] || n);
            const sharedBase = [...interB].map(n => allNormed[n] || n);
            // 포뮬러 특징 성분 (실리콘·기제 제외 — 진짜 차이를 만드는 성분)
            const keyShared = sharedBase.filter(ing => {
              const cat = classifyIng(ing).name;
              return !['용매·기제'].includes(cat);
            }).slice(0, 10);
            pairs.push({
              a: allSets[i], b: allSets[j],
              jaccard, jaccardBase,
              interSize: inter.size, unionSize: union.size,
              interBaseSize: interB.size, unionBaseSize: unionB.size,
              sharedIngs, keyShared,
            });
          }
        }
      }

      if (pairs.length === 0) {
        return `<div class="card" style="margin-top:16px;padding:16px 20px;text-align:center;color:var(--text-lt);font-size:.8rem">
          🔍 유사 전성분 구조 쌍이 발견되지 않았습니다. 전성분이 더 많이 입력되면 분석이 정교해집니다.
        </div>`;
      }

      // 포뮬러 유사도(향료 제외) 기준으로 정렬
      pairs.sort((a, b) => b.jaccardBase - a.jaccardBase);

      const tierColor = j => j >= 0.55 ? '#EF4444' : j >= 0.38 ? '#F59E0B' : '#22C55E';
      const tierLabel = j => j >= 0.55 ? '매우 유사' : j >= 0.38 ? '유사' : '부분 유사';
      const tierBg = j => j >= 0.55 ? 'rgba(239,68,68,.05)' : j >= 0.38 ? 'rgba(245,158,11,.05)' : 'rgba(34,197,94,.04)';

      const getInsight = (keyShared) => {
        const cats = keyShared.map(ing => classifyIng(ing).name);
        const parts = [];
        if (cats.includes('실리콘류')) parts.push('실리콘 베이스 동일');
        if (cats.includes('식물성 오일')) parts.push('식물성 오일 구성 공유');
        if (cats.includes('단백질·아미노산')) parts.push('단백질·아미노산 계열 일치');
        if (cats.includes('에모리엔트·에스터')) parts.push('에모리엔트 구조 유사');
        if (cats.includes('계면활성제')) parts.push('계면활성제 계열 공유');
        if (cats.includes('보습·습윤제')) parts.push('보습 성분 공유');
        return parts.length ? parts.join(' · ') : '기타 포뮬러 구조 유사';
      };

      return `
      <div class="card" style="margin-top:16px">
        <div class="card-header" style="background:rgba(99,102,241,.08)">
          <span style="font-size:1rem">🔬</span>
          <span class="card-title" style="color:#4338CA">유사 전성분 구조 분석 — 전체 성분 Jaccard 유사도</span>
          <span style="margin-left:auto;font-size:.68rem;color:var(--text-lt)">${pairs.length}쌍 발견</span>
        </div>
        <div class="card-body">
          <div style="font-size:.72rem;color:var(--text-md);padding:8px 12px;background:rgba(99,102,241,.05);border-left:3px solid #6366F1;border-radius:4px;margin-bottom:14px;line-height:1.7">
            💡 <b>분석 목적:</b> 주성분 포함 <b>전체 성분을 기준으로 구조가 유사한 제품 쌍</b>을 Jaccard 계수로 감지합니다.
            <b>포뮬러 유사도(향료 제외)</b>가 높다 = 동일 ODM 공장 또는 동일 포뮬러 베이스 사용 가능성이 높습니다.
            <div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">
              <span style="background:rgba(239,68,68,.12);color:#EF4444;border-radius:4px;padding:1px 6px;font-size:.66rem;font-weight:700">● 매우 유사 55%↑</span>
              <span style="background:rgba(245,158,11,.12);color:#F59E0B;border-radius:4px;padding:1px 6px;font-size:.66rem;font-weight:700">● 유사 38~55%</span>
              <span style="background:rgba(34,197,94,.12);color:#22C55E;border-radius:4px;padding:1px 6px;font-size:.66rem;font-weight:700">● 부분 유사 15~38%</span>
              <span style="margin-left:4px;font-size:.66rem;color:var(--text-lt);align-self:center">│ 왼쪽=전체 유사도 / 오른쪽=포뮬러 유사도(향료 제외)</span>
            </div>
          </div>

          ${pairs.slice(0, 20).map((pair, idx) => {
            const pct = Math.round(pair.jaccard * 100);
            const pctB = Math.round(pair.jaccardBase * 100);
            const tc = tierColor(pair.jaccardBase);
            const tl = tierLabel(pair.jaccardBase);
            const tb = tierBg(pair.jaccardBase);
            const insight = getInsight(pair.keyShared);
            return `
            <div style="background:${tb};border:1.5px solid ${tc}44;border-radius:10px;padding:12px 14px;margin-bottom:10px">
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap">
                <span style="font-size:.65rem;color:var(--text-lt);font-weight:600;flex-shrink:0">#${idx+1}</span>
                <div style="flex:1;min-width:140px">
                  <div style="font-size:.75rem;font-weight:700;color:var(--brown)">${pair.a.name.length>32?pair.a.name.slice(0,32)+'…':pair.a.name}</div>
                  <div style="font-size:.62rem;color:var(--text-lt)">${pair.a.brand}</div>
                </div>
                <div style="text-align:center;flex-shrink:0;min-width:100px">
                  <div style="display:flex;gap:6px;justify-content:center;align-items:baseline">
                    <div>
                      <div style="font-size:.6rem;color:var(--text-lt)">전체</div>
                      <div style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:${tc};line-height:1">${pct}%</div>
                    </div>
                    <span style="font-size:.8rem;color:var(--text-lt)">│</span>
                    <div>
                      <div style="font-size:.6rem;color:var(--text-lt)">포뮬러</div>
                      <div style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:700;color:${tc};line-height:1">${pctB}%</div>
                    </div>
                  </div>
                  <div style="font-size:.6rem;color:${tc};font-weight:600;margin-top:1px">${tl}</div>
                  <div style="font-size:.56rem;color:var(--text-lt)">${pair.interSize}/${pair.unionSize}종 공통</div>
                </div>
                <div style="flex:1;min-width:140px;text-align:right">
                  <div style="font-size:.75rem;font-weight:700;color:var(--brown)">${pair.b.name.length>32?pair.b.name.slice(0,32)+'…':pair.b.name}</div>
                  <div style="font-size:.62rem;color:var(--text-lt)">${pair.b.brand}</div>
                </div>
              </div>
              <div style="height:5px;background:var(--border-lt);border-radius:3px;margin-bottom:8px;position:relative">
                <div style="height:100%;width:${pctB}%;background:${tc};border-radius:3px;transition:.3s"></div>
              </div>
              <div style="margin-bottom:6px">
                <span style="font-size:.62rem;color:var(--text-lt);font-weight:600">주요 공유 성분 (향료 제외):</span>
                <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px">
                  ${pair.keyShared.length > 0
                    ? pair.keyShared.map(ing => {
                        const cat = classifyIng(ing);
                        return `<span style="background:${cat.bg};color:${cat.color};border:1px solid ${cat.color}66;border-radius:10px;font-size:.62rem;padding:1px 7px">${ing}</span>`;
                      }).join('')
                    : '<span style="font-size:.62rem;color:var(--text-lt)">–</span>'}
                </div>
              </div>
              <div style="font-size:.67rem;color:var(--text-md);background:white;border-radius:4px;padding:4px 8px;border-left:2px solid ${tc}">
                🔎 ${insight} — 동일 ODM 포뮬러 가능성 ${pair.jaccardBase >= 0.55 ? '<b style="color:#EF4444">높음 ⚠️</b>' : pair.jaccardBase >= 0.38 ? '<b style="color:#F59E0B">중간</b>' : '낮음'}
              </div>
            </div>`;
          }).join('')}
          ${pairs.length > 20 ? `<div style="text-align:center;font-size:.72rem;color:var(--text-lt);padding:8px">상위 20쌍 표시 중 (전체 ${pairs.length}쌍)</div>` : ''}
        </div>
      </div>`;
    })()}
  `;
}

function renderCompList(comps) {
  if (!comps.length) return '<div class="empty-state"><p>해당 채널의 제품이 없습니다</p></div>';
  return `
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>제품명</th><th>채널</th><th>가격</th><th>용량</th><th>10ml당</th>
          <th>평점</th><th>리뷰수</th><th>실리콘</th><th>제형</th><th>제조국</th><th>전성분</th><th>액션</th>
        </tr></thead>
        <tbody>
          ${comps.map(c => {
            const per10 = c.volume ? Math.round(num(c.price)/num(c.volume)*10) : 0;
            const priceTier = num(c.price) < 15000 ? ['tag-green','저가'] : num(c.price) < 25000 ? ['tag-gold','중가'] : ['tag-red','고가'];
            const ingCount = c.fullIngredients ? c.fullIngredients.split(',').filter(x=>x.trim()).length : 0;
            return `<tr>
              <td>
                <div style="display:flex;align-items:center;gap:8px">
                  ${c.imageUrl ? `<img src="${c.imageUrl}" style="width:36px;height:36px;object-fit:cover;border-radius:4px">` : '<div style="width:36px;height:36px;background:var(--beige);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:.8rem">📦</div>'}
                  <div>
                    <div style="font-weight:600;font-size:.82rem">${c.productName}</div>
                    <div style="font-size:.68rem;color:var(--text-lt)">${c.brand}</div>
                  </div>
                </div>
              </td>
              <td><span class="tag tag-blue">${c.channel}</span></td>
              <td class="num"><span class="tag ${priceTier[0]}">₩${fmt(c.price)}</span></td>
              <td class="num">${c.volume}ml</td>
              <td class="num">₩${fmt(per10)}</td>
              <td>${stars(c.rating)} <span style="font-size:.7rem">${c.rating}</span></td>
              <td class="num">${fmt(c.reviewCount)}</td>
              <td><span class="tag ${c.hasSilicone==='예'?'tag-red':'tag-green'}">${c.hasSilicone==='예'?'포함':'무실리콘'}</span></td>
              <td><span class="tag tag-gray">${c.texture||'–'}</span></td>
              <td style="font-size:.72rem;color:var(--text-lt)">${c.madeIn||'–'}</td>
              <td style="font-size:.72rem">
                ${ingCount > 0
                  ? `<span style="background:rgba(34,197,94,.1);color:#166534;border:1px solid rgba(34,197,94,.25);border-radius:20px;padding:2px 8px;font-size:.65rem;cursor:pointer;font-weight:600" onclick="openCompDetail('${c.id}')">${ingCount}종 입력됨</span>`
                  : `<span style="color:var(--text-lt);font-size:.68rem;cursor:pointer" onclick="openCompDetail('${c.id}')">미입력</span>`
                }
              </td>
              <td>
                <button class="btn btn-sm btn-outline" onclick="openCompDetail('${c.id}')">상세</button>
                <button class="btn btn-sm btn-ghost" onclick="deleteComp('${c.id}')">🗑</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function openCompForm() {
  const nc = { id:uid(), productName:'', brand:'', channel:'쿠팡', keyword:'', link:'', imageUrl:'', price:0, volume:50, rating:4.0, reviewCount:0, fullIngredients:'', hasSilicone:'아니오', hasPlantOil:'예', hasProtein:'아니오', hasFragrance:'예', fragranceType:'', texture:'가벼움', usageFeel:'', target:'', mainCopy:'', pageHighlight:'', packageFeature:'', differentiation:'', weakness:'', improvementPotential:'', memo:'' };
  APP.competitors.push(nc);
  save();
  openCompDetail(nc.id);
}

function openCompDetail(id) {
  const c = APP.competitors.find(x => x.id === id);
  if (!c) return;
  const per10 = c.volume ? Math.round(num(c.price)/num(c.volume)*10) : 0;
  const ingList = parseIngredients(c.fullIngredients||'');

  // 향 파싱 헬퍼
  const renderFragrance = () => {
    if (!c.fragranceNotes) return '';
    try {
      const fn = JSON.parse(c.fragranceNotes);
      if (!fn || !fn.scents || !fn.scents.length) return '';
      return `<div style="margin-top:12px;padding:12px;background:rgba(244,114,182,.05);border:1px solid rgba(244,114,182,.25);border-radius:8px">
        <div style="font-size:.65rem;font-weight:700;color:#9D174D;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px">🌸 향 프로필 — 탑/미들/베이스 노트</div>
        ${fn.multiScentNote ? `<div style="font-size:.7rem;color:#831843;background:rgba(244,114,182,.1);padding:5px 8px;border-radius:4px;margin-bottom:8px">${fn.multiScentNote}</div>` : ''}
        ${fn.scents.map(s=>`
          <div style="background:white;border:1px solid rgba(244,114,182,.2);border-radius:6px;padding:10px;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
              <span style="font-weight:700;font-size:.8rem;color:#9D174D">${s.name}</span>
              <span style="background:rgba(244,114,182,.15);color:#BE185D;border-radius:20px;font-size:.6rem;padding:1px 8px">${s.type}</span>
            </div>
            ${s.overall ? `<div style="font-size:.72rem;color:#4C1D95;font-style:italic;margin-bottom:6px;line-height:1.5">💬 ${s.overall}</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">
              ${[['🎵 탑',s.top],['🎶 미들',s.middle],['🎸 베이스',s.base]].filter(([,v])=>v).map(([l,v])=>`
                <div style="background:rgba(249,168,212,.08);padding:6px 8px;border-radius:4px">
                  <div style="font-size:.6rem;font-weight:700;color:#9D174D;margin-bottom:2px">${l}</div>
                  <div style="font-size:.68rem;color:#500724;line-height:1.5">${v}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('')}
      </div>`;
    } catch(e) { return ''; }
  };

  openModal(`⚔️ ${c.productName||'새 경쟁제품'} — 상세 & 편집`, `
    <!-- ── 상단 요약 패널 ── -->
    <div style="background:var(--brown);border-radius:8px;padding:14px 16px;margin-bottom:16px;color:var(--ivory)">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:var(--gold-lt)">${c.productName||'–'}</div>
          <div style="font-size:.72rem;color:rgba(250,248,243,.55);margin-top:2px">${c.brand} · ${c.channel}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="background:rgba(184,152,90,.25);color:var(--gold-lt);border-radius:6px;padding:4px 10px;font-size:.75rem;font-weight:700">₩${fmt(c.price)}</span>
          <span style="background:rgba(255,255,255,.08);border-radius:6px;padding:4px 10px;font-size:.75rem">${c.volume}ml</span>
          <span style="background:rgba(255,255,255,.08);border-radius:6px;padding:4px 10px;font-size:.75rem">10ml당 ₩${fmt(per10)}</span>
          <span style="background:${c.hasSilicone==='예'?'rgba(239,68,68,.3)':'rgba(34,197,94,.2)'};color:${c.hasSilicone==='예'?'#FCA5A5':'#86EFAC'};border-radius:6px;padding:4px 10px;font-size:.72rem">${c.hasSilicone==='예'?'실리콘 포함':'무실리콘'}</span>
          <span style="background:rgba(255,255,255,.08);border-radius:6px;padding:4px 10px;font-size:.75rem">${stars(c.rating)} ${c.rating}</span>
          <span style="background:rgba(255,255,255,.08);border-radius:6px;padding:4px 10px;font-size:.72rem">리뷰 ${fmt(c.reviewCount)}</span>
        </div>
      </div>
      ${c.mainCopy ? `<div style="margin-top:10px;padding:8px 12px;background:rgba(184,152,90,.15);border-left:3px solid var(--gold-lt);border-radius:0 4px 4px 0;font-size:.78rem;color:var(--ivory);font-style:italic">"${c.mainCopy}"</div>` : ''}
      ${(c.madeIn||c.manufacturer||c.responsibleSeller) ? `
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">
        ${c.madeIn ? `<span style="background:rgba(56,189,248,.15);color:#7DD3FC;border-radius:6px;padding:3px 10px;font-size:.68rem">🌍 제조국: <b>${c.madeIn}</b></span>` : ''}
        ${c.manufacturer ? `<span style="background:rgba(167,139,250,.15);color:#C4B5FD;border-radius:6px;padding:3px 10px;font-size:.68rem">🏭 제조업자: <b>${c.manufacturer}</b></span>` : ''}
        ${c.responsibleSeller ? `<span style="background:rgba(251,146,60,.15);color:#FED7AA;border-radius:6px;padding:3px 10px;font-size:.68rem">📋 책임판매업자: <b>${c.responsibleSeller}</b></span>` : ''}
      </div>` : ''}
    </div>

    <!-- ── 전성분 패널 ── -->
    <div style="margin-bottom:14px">
      <div style="font-size:.68rem;font-weight:700;color:#166534;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px">
        🧪 전성분 ${ingList.length > 0 ? `<span style="background:rgba(34,197,94,.15);border-radius:20px;padding:1px 8px">${ingList.length}종</span>` : '<span style="color:#92400E;background:#FEF3C7;border-radius:20px;padding:1px 8px;font-size:.62rem">미입력 — 아래 편집폼에 입력해주세요</span>'}
      </div>
      ${ingList.length > 0 ? `
      <div style="display:flex;flex-wrap:wrap;gap:3px;max-height:130px;overflow-y:auto;padding:8px;background:var(--ivory);border-radius:6px;border:1px solid var(--border-lt)">
        ${ingList.map((ing,i) => {
          const lower = (ing||'').toLowerCase().replace(/\s/g,'');
          const cat = ['실록세인','사이클로펜타실록세인','사이클로헥사실록세인','사이클로테트라실록세인','다이메티콘','다이메치콘','디메치콘','디메티콘','다이메티콘올','다이실록세인','다이아미터콘','아모다이메티콘','트라이실록세인','사이클로매치콘','사이클로메치콘','폴리다이메틸실록시','실세스퀴옥세인','카프릴릴메티콘','dimethicone','cyclomethicone','cyclopentasiloxane','cyclohexasiloxane','trimethicone','siloxane','silsesquioxane'].some(k=>lower.includes(k)) ? {c:'#EF4444',b:'rgba(239,68,68,.1)'}
            : ['오일','oil','jojoba','argan','camellia','squalane','피마자','호호바','올리브','해바라기','마카다미아','아보카도'].some(k=>lower.includes(k)) ? {c:'#22C55E',b:'rgba(34,197,94,.1)'}
            : ['protein','amino','keratin','silk','hydrolyzed','peptide','단백질','아미노'].some(k=>lower.includes(k)) ? {c:'#B8985A',b:'rgba(184,152,90,.1)'}
            : ['glycerin','panthenol','ceramide','betaine','hyaluronic','글리세린','판테놀','세라마이드'].some(k=>lower.includes(k)) ? {c:'#38BDF8',b:'rgba(56,189,248,.1)'}
            : ['fragrance','parfum','향료','리날룰','제라니올','시트로넬롤','리모넨','헥실신남알','이오논','벤질'].some(k=>lower.includes(k)) ? {c:'#F472B6',b:'rgba(244,114,182,.1)'}
            : ['paraben','phenoxyethanol','benzoate','sorbate','페녹시','에탄올','이디티에이'].some(k=>lower.includes(k)) ? {c:'#FB923C',b:'rgba(251,146,60,.1)'}
            : {c:'#94A3B8',b:'rgba(148,163,184,.1)'};
          return `<span style="background:${cat.b};color:${cat.c};border-radius:20px;font-size:.6rem;padding:2px 7px;border:1px solid ${cat.c}33;white-space:nowrap">${i+1}. ${ing}</span>`;
        }).join('')}
      </div>` : ''}
    </div>

    <!-- ── 향 프로필 ── -->
    ${renderFragrance()}

    <!-- ── 분석 요약 ── -->

    <div class="form-row">

      <div class="form-group"><label class="form-label">평점</label><input class="form-input" type="number" step="0.1" id="ce-rating" value="${c.rating}"></div>
      <div class="form-group"><label class="form-label">리뷰수</label><input class="form-input" type="number" id="ce-reviewCount" value="${c.reviewCount}"></div>
      <div class="form-group"><label class="form-label">제조국</label><input class="form-input" id="ce-madeIn" value="${c.madeIn||''}"></div>

        <select class="form-select" id="ce-texture">${['가벼움','중간','무거움','워터리','오일리','세럼형'].map(t=>`<option${c.texture===t?' selected':''}>${t}</option>`).join('')}</select>

      <input class="form-input" id="ce-imageUrl" placeholder="이미지 URL 입력" value="${c.imageUrl||''}">
      <label class="btn btn-outline btn-sm" style="margin-top:6px;cursor:pointer">📎 이미지 업로드
        <input type="file" accept="image/*" style="display:none" onchange="uploadCompImg('${c.id}',this)">
      </label>
    </div>
  `, `
    <button class="btn btn-outline" onclick="closeModal()">닫기</button>
    <button class="btn btn-primary" onclick="saveCompDetail('${id}')">💾 저장</button>
  `, 'modal-lg');
}
function uploadCompImg(id, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { document.getElementById('ce-imageUrl').value = e.target.result; };
  reader.readAsDataURL(file);
}

function saveCompDetail(id) {
  const c = APP.competitors.find(x => x.id === id);
  if (!c) return;

  let saved = [];
  ['productName','brand','channel','keyword','price','volume','rating','reviewCount',
   'texture','hasSilicone','hasFragrance','fragranceType','target','mainCopy',
   'fullIngredients','pageHighlight','differentiation','weakness','improvementPotential',
   'memo','imageUrl','naverKeywords','naverTags','bundleInfo','skuStrategy','fragranceNotes',
   'madeIn','manufacturer','responsibleSeller'
  ].forEach(k => {
    const el = document.getElementById('ce-'+k);
    if (el) {
      c[k] = ['price','volume','rating','reviewCount'].includes(k) ? num(el.value) : el.value;
      saved.push(k);
    }
  });

  save(); // localStorage에 즉시 저장

  // 저장 확인 토스트
  const toast = document.createElement('div');
  toast.textContent = `✅ 저장 완료 — ${c.productName || '제품'}`;
  toast.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;background:#166534;color:white;padding:10px 18px;border-radius:8px;font-size:.82rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:opacity .4s';
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 2000);

  closeModal();
  // 현재 페이지 유지하면서 재렌더링 (강제 이동 X)
  const page = currentPage;
  navigate(page);
}

function deleteComp(id) {
  if (!confirm('삭제?')) return;
  APP.competitors = APP.competitors.filter(x => x.id !== id);
  save();
  navigate('competitors');
}
